<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Domain Lens - color ideas</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f3ef;color:#242724;font-family:system-ui,sans-serif}main{max-width:1260px;margin:auto;padding:40px 24px}h1{margin:0 0 6px;font-size:30px;letter-spacing:-.03em}header p{color:#69716b;margin:0 0 30px}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}.option{border:2px solid transparent;background:white;border-radius:14px;overflow:hidden;box-shadow:0 5px 24px #1d33200e;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit}.option:hover,.option.selected{border-color:#728d70}.top{padding:17px 20px}.top h2{margin:0;font-size:18px}.top p{margin:5px 0 0;color:#6b746e;font-size:13px}.terminal{background:var(--bg);color:var(--text);padding:18px;font:11px/1.45 Consolas,monospace;min-height:340px}.title{color:var(--accent);font-weight:bold;letter-spacing:.07em}.muted{color:var(--muted)}.panels{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.node{border:1px solid var(--border);border-radius:4px;padding:7px 8px;margin:4px 0;color:var(--text)}.node.active{border-color:var(--accent);background:var(--selected)}.node b{color:var(--accent)}.arrow{color:var(--request);padding-left:12px}.response{color:var(--response);padding-left:12px}.code{border:1px solid var(--border);border-radius:4px;padding:8px;overflow:hidden;white-space:nowrap}.code b{color:var(--accent)}.kw{color:var(--keyword)}.comment{color:var(--muted)}.controls{color:var(--muted);border-top:1px solid var(--border);padding-top:8px;margin-top:12px}.choice{margin-top:24px;padding:16px 20px;border-radius:10px;background:#e8eee6;line-height:1.5}code{background:#e1e8df;padding:2px 6px;border-radius:4px}a{color:#507952}@media(max-width:400px){.options{grid-template-columns:1fr}.panels{grid-template-columns:1fr}}
</style></head><body><main><header><h1>Choose a color direction</h1><p>Same example flow, three possible terminal palettes. Select one to see its name below.</p></header><div class="options" id="options"></div><div class="choice" id="choice">Select a palette, then tell me its name. This is a preview; it doesn't change the TUI yet.</div></main><script>
const palettes=[{name:'1. Warm charcoal',desc:'Soft dark gray, amber and sage. Calm and low contrast.',vars:['#272624','#eeeae1','#a1a098','#dda95a','#4b4030','#625c52','#d7ae71','#8fb89c','#c4a1d4']},{name:'2. Paper & ink',desc:'A light terminal with muted green and terracotta.',vars:['#f3f0e8','#30352f','#848a80','#47785d','#dfebdb','#c5cdc0','#af704a','#578670','#826388']},{name:'3. Forest night',desc:'Deep neutral green, mint and soft orange.',vars:['#202a25','#e6eae4','#92a59a','#8ac69e','#2d4939','#526b5a','#e1b97b','#8ccdb2','#c1a6d4']}];
const keys=['bg','text','muted','accent','selected','border','request','response','keyword'];const host=document.getElementById('options');for(const palette of palettes){const option=document.createElement('button');option.className='option';option.type='button';for(let i=0;i<keys.length;i++)option.style.setProperty('--'+keys[i],palette.vars[i]);option.innerHTML=`<div class="top"><h2>${palette.name}</h2><p>${palette.desc}</p></div><div class="terminal"><div class="title">DOMAIN LENS / SKI REPORT</div><div class="muted">select component | inspect source</div><div class="panels"><div><div class="node">Browser<br><span class="muted">OUT: HTTP GET</span></div><div class="arrow">&darr; request for resort</div><div class="node active"><b>&#9656; RequestHandler</b><br><span class="muted">IN: resort: str</span><br><span class="muted">OUT: formatted report</span></div><div class="arrow">&darr; resort: str</div><div class="node">SnowService<br><span class="muted">OUT: WeatherReport</span></div><div class="response">&uarr; weather report</div></div><div class="code"><b>ski_flow.py</b><br><br><span class="comment">// Build a snow report</span><br><span class="kw">var</span> resort = ...;<br><span class="kw">int</span> snow = ...;<br><span class="kw">int</span> depth = ...;<br><span class="kw">int</span> season = ...;<br><br><span class="kw">return</span> service.report(<br>&nbsp;&nbsp;resort<br>);</div></div><div class="controls">Click box | scroll source | Q quit</div></div>`;option.onclick=()=>{document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));option.classList.add('selected');document.getElementById('choice').textContent='Selected: '+palette.name+'. Tell me if you would like this one, or what you would change.'};host.append(option)}
</script></body></html>
